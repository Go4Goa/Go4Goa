services:
  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: go_goa
      POSTGRES_PASSWORD: go_goa_local_only
      POSTGRES_DB: go_goa
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - go_goa_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U go_goa -d go_goa"]
      interval: 2s
      timeout: 5s
      retries: 20
volumes:
  go_goa_db:
